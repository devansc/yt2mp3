<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yt2mp3</title>
<style>
  :root {
    --bg: #f5f5f7; --surface: #ffffff; --surface-2: #f0f1f3; --line: rgba(0,0,0,.08);
    --text: #1d1d1f; --muted: #6e6e73; --faint: #a1a1a6;
    --accent: #14a64a; --accent-hover: #11923f; --accent-ink: #ffffff; --accent-soft: rgba(20,166,74,.12);
    --danger: #e5484d; --danger-soft: rgba(229,72,77,.1);
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
    --radius: 14px; --seg-on: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1013; --surface: #18191d; --surface-2: #212328; --line: rgba(255,255,255,.07);
      --text: #f2f2f4; --muted: #9a9ba3; --faint: #5d5f66;
      --accent: #22c55e; --accent-hover: #2fd36b; --accent-ink: #05230f; --accent-soft: rgba(34,197,94,.14);
      --danger: #ff6b6b; --danger-soft: rgba(255,107,107,.12);
      --shadow: 0 1px 0 rgba(255,255,255,.03) inset; --seg-on: #34363d;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 28px 64px; }
  button, .seg, .drop, header { -webkit-user-select: none; user-select: none; }
  svg { display: block; flex-shrink: 0; }

  /* Header */
  header { display: flex; align-items: center; gap: 14px; margin-bottom: 32px; }
  .logo { width: 44px; height: 44px; border-radius: 11px; display: grid; place-items: center; color: #fff;
          background: linear-gradient(160deg, #34e678, #087854); box-shadow: 0 2px 8px rgba(8,120,84,.3); }
  .brand { flex: 1; }
  .brand h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.3px; }
  .brand p { margin: 0; font-size: 13px; color: var(--muted); }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px;
         height: 44px; padding: 0 22px; border: 0; border-radius: 10px; cursor: pointer;
         font-family: inherit; font-size: 15px; font-weight: 600; line-height: 1; background: var(--accent); color: var(--accent-ink);
         transition: background .15s, opacity .15s; }
  .btn:hover:not(:disabled) { background: var(--accent-hover); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.ghost { background: var(--surface-2); color: var(--text); height: 36px; padding: 0 14px; font-size: 13px; }
  .btn.ghost:hover:not(:disabled) { background: var(--line); }

  /* Segmented control */
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; margin-bottom: 16px;
         background: var(--surface-2); border-radius: 12px; }
  .seg button { height: 36px; border: 0; border-radius: 9px; background: transparent; color: var(--muted);
                font-family: inherit; font-size: 14px; font-weight: 600; line-height: 1; cursor: pointer; display: flex; align-items: center;
                justify-content: center; gap: 8px; transition: background .15s, color .15s; }
  .seg button.on { background: var(--seg-on); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

  /* Cards */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
          box-shadow: var(--shadow); padding: 28px; margin-bottom: 20px; }
  .panel[hidden] { display: none; }
  .hint { margin: 12px 0 0; font-size: 13px; color: var(--muted); }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* URL input */
  .field { display: flex; gap: 10px; }
  .field input { flex: 1; min-width: 0; height: 44px; padding: 0 16px; font: inherit; color: var(--text);
                 background: var(--surface-2); border: 1px solid transparent; border-radius: 10px; outline: none;
                 transition: border-color .15s, background .15s; }
  .field input::placeholder { color: var(--faint); }
  .field input:focus { border-color: var(--accent); background: var(--surface); }

  /* Drop zone */
  .drop { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
          min-height: 150px; padding: 24px; text-align: center; cursor: pointer;
          border: 1.5px dashed var(--line); border-radius: 12px; background: var(--surface-2);
          transition: border-color .15s, background .15s; }
  .drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
  .drop .ic { color: var(--accent); margin-bottom: 4px; }
  .drop strong { font-size: 15px; font-weight: 600; }
  .drop span { font-size: 13px; color: var(--muted); }
  .chosen { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
  .chosen[hidden] { display: none; }
  .chosen .name { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; font-size: 14px;
                  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
  .chosen .name b { color: var(--text); font-weight: 600; overflow: hidden; text-overflow: ellipsis; }

  details { margin-top: 18px; font-size: 13px; color: var(--muted); }
  summary { cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: 6px; font-weight: 500; }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "›"; display: inline-block; font-size: 16px; line-height: 1; transition: transform .15s; }
  details[open] summary::before { transform: rotate(90deg); }
  details ol { margin: 10px 0 0; padding-left: 20px; }
  details li { margin: 4px 0; }
  details p { margin: 10px 0 0; }

  /* Results */
  .results-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  .results-head h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .results-head .count { font-size: 13px; color: var(--muted); font-weight: 400; margin-left: 6px; }
  #list { list-style: none; margin: 0; padding: 0; }
  .item { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-top: 1px solid var(--line); }
  .item:first-child { border-top: 0; }
  .status { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
            background: var(--surface-2); color: var(--faint); font-size: 11px; font-weight: 600; }
  .item.active .status { color: var(--accent); background: var(--accent-soft); }
  .item.done .status { color: var(--accent-ink); background: var(--accent); }
  .item.error .status { color: var(--danger); background: var(--danger-soft); }
  .item.active .status svg { animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .meta { flex: 1; min-width: 0; }
  .title { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sub { font-size: 12px; color: var(--muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item.error .sub { color: var(--danger); }
  .bar { height: 3px; margin-top: 8px; border-radius: 2px; background: var(--surface-2); overflow: hidden; }
  .bar > span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }
  .item.done .bar, .item.error .bar, .item.queued .bar { display: none; }
  .icon-btn { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center;
              color: var(--muted); background: transparent; transition: background .15s, color .15s; }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); text-decoration: none; }

  @media (max-width: 520px) {
    .wrap { padding: 24px 16px 48px; }
    .card { padding: 20px; }
    .field { flex-direction: column; }
  }
</style>
</head>
<body>
<!-- Icons -->
<svg width="0" height="0" style="position:absolute">
  <symbol id="i-note" viewBox="0 0 24 24"><path fill="currentColor" d="M9 17.5V6.6c0-.5.4-1 .9-1.1l9-1.8c.6-.1 1.1.3 1.1.9V15.5a2.5 2.5 0 1 1-2-2.45V7.3l-7 1.4v8.8a2.5 2.5 0 1 1-2-2.45z"/></symbol>
  <symbol id="i-yt" viewBox="0 0 24 24"><path fill="currentColor" d="M21.6 7.2a2.5 2.5 0 0 0-1.8-1.8C18.2 5 12 5 12 5s-6.2 0-7.8.4A2.5 2.5 0 0 0 2.4 7.2 26 26 0 0 0 2 12a26 26 0 0 0 .4 4.8 2.5 2.5 0 0 0 1.8 1.8C5.8 19 12 19 12 19s6.2 0 7.8-.4a2.5 2.5 0 0 0 1.8-1.8A26 26 0 0 0 22 12a26 26 0 0 0-.4-4.8zM10 15V9l5.2 3z"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4.6l2 2h8.4A1.5 1.5 0 0 1 21 9.5v8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 20h14"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M4 15v3.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V15"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M14 3H6.5A1.5 1.5 0 0 0 5 4.5v15A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5V8zm0 0v5h5"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" d="M7 7l10 10M17 7 7 17"/></symbol>
  <symbol id="i-spin" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" d="M12 4a8 8 0 1 1-8 8"/></symbol>
</svg>

<div class="wrap">
  <header>
    <div class="logo"><svg width="24" height="24"><use href="#i-note"/></svg></div>
    <div class="brand">
      <h1>yt2mp3</h1>
      <p>YouTube and Spotify playlists to MP3</p>
    </div>
    <button id="open-folder" class="btn ghost" style="display:none" title="Open downloads folder">
      <svg width="16" height="16"><use href="#i-folder"/></svg> Downloads
    </button>
  </header>

  <div class="seg" role="tablist">
    <button class="on" data-tab="yt" role="tab"><svg width="18" height="18"><use href="#i-yt"/></svg> YouTube</button>
    <button data-tab="pl" role="tab"><svg width="16" height="16"><use href="#i-list"/></svg> Spotify playlist</button>
  </div>

  <section class="card panel" id="tab-yt">
    <div class="field">
      <input id="yt-url" type="text" placeholder="Paste a YouTube link or type a song name" autofocus>
      <button id="yt-btn" class="btn">Convert</button>
    </div>
    <p class="hint">Saves a 192 kbps MP3.</p>
  </section>

  <section class="card panel" id="tab-pl" hidden>
    <label class="drop" id="drop">
      <input id="csv-file" type="file" accept=".csv" hidden>
      <svg class="ic" width="28" height="28"><use href="#i-upload"/></svg>
      <strong>Drop a playlist CSV here</strong>
      <span>or click to choose a file</span>
    </label>
    <div class="chosen" id="chosen" hidden>
      <div class="name"><svg width="16" height="16"><use href="#i-file"/></svg><b id="chosen-name"></b></div>
      <button id="csv-btn" class="btn">Download tracks</button>
    </div>
    <details>
      <summary>How do I get a CSV?</summary>
      <ol>
        <li>Open <a href="https://exportify.net" target="_blank" rel="noopener">exportify.net</a> and sign in with Spotify.</li>
        <li>Click <b>Export</b> next to your playlist.</li>
        <li>Drop the downloaded file above.</li>
      </ol>
      <p>Any CSV with a track name and artist column works.</p>
    </details>
  </section>

  <section class="card" id="results" style="display:none">
    <div class="results-head">
      <h2>Downloads<span class="count" id="count"></span></h2>
      <button id="dl-all" class="btn ghost" style="display:none" disabled>
        <svg width="16" height="16"><use href="#i-down"/></svg> <span>Save all as .zip</span>
      </button>
    </div>
    <ul id="list"></ul>
  </section>
</div>

<script>
const $ = id => document.getElementById(id);
const list = $('list'), results = $('results'), dlAll = $('dl-all'), countEl = $('count');
const icon = (name, size = 14) => `<svg width="${size}" height="${size}"><use href="#i-${name}"/></svg>`;
function esc(s) { return (s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// Inside the Mac app (pywebview) files are already saved to ~/Downloads/yt2mp3,
// so links reveal them in Finder and "Save all" uses a native Save dialog.
const inApp = () => !!(window.pywebview && window.pywebview.api);
function setupApp() {
  if (!inApp()) return;
  $('open-folder').style.display = '';
  $('open-folder').onclick = () => window.pywebview.api.open_folder();
}
window.addEventListener('pywebviewready', setupApp);
setupApp();
document.addEventListener('click', e => {
  const a = e.target.closest('a.icon-btn');
  if (a && inApp()) { e.preventDefault(); window.pywebview.api.reveal(a.dataset.file); }
});

// Tabs
document.querySelectorAll('.seg button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.seg button').forEach(x => x.classList.toggle('on', x === b));
  $('tab-yt').hidden = b.dataset.tab !== 'yt';
  $('tab-pl').hidden = b.dataset.tab !== 'pl';
});

// Results list
let total = 0, finished = 0;
function updateCount() { countEl.textContent = total > 1 ? `${finished} of ${total}` : ''; }

function render(items, jobId) {
  results.style.display = '';
  list.innerHTML = '';
  total = items.length; finished = 0; updateCount();
  if (items.length > 1) {
    dlAll.style.display = '';
    dlAll.disabled = true;
    dlAll.onclick = () => {
      if (inApp()) window.pywebview.api.save_zip(jobId);
      else window.location = '/api/zip/' + jobId;
    };
  } else {
    dlAll.style.display = 'none';
  }
  items.forEach((it, n) => {
    const li = document.createElement('li');
    li.className = 'item queued';
    li.id = 'item-' + it.index;
    li.innerHTML = `
      <div class="status">${items.length > 1 ? n + 1 : icon('note')}</div>
      <div class="meta">
        <div class="title" title="${esc(it.label)}">${esc(it.label)}</div>
        <div class="sub">Waiting…</div>
        <div class="bar"><span></span></div>
      </div>
      <div class="action"></div>`;
    list.appendChild(li);
  });
  results.scrollIntoView({behavior: 'smooth', block: 'start'});
}

function setItem(index, state, sub) {
  const li = $('item-' + index);
  if (!li) return null;
  if (state) {
    li.className = 'item ' + state;
    const st = li.querySelector('.status');
    if (state === 'active') st.innerHTML = icon('spin');
    if (state === 'done') st.innerHTML = icon('check');
    if (state === 'error') st.innerHTML = icon('x');
  }
  if (sub !== undefined) { const s = li.querySelector('.sub'); s.textContent = sub; s.title = sub; }
  return li;
}

function cleanError(msg) {
  return (msg || 'Download failed').replace(/^ERROR:\s*/, '').replace(/^\[[^\]]+\]\s*[\w-]+:\s*/, '');
}

function listen(jobId) {
  const es = new EventSource('/api/stream/' + jobId);
  es.onmessage = e => {
    const ev = JSON.parse(e.data);
    if (ev.type === 'status') setItem(ev.index, 'active', 'Starting…');
    if (ev.type === 'progress') {
      const li = setItem(ev.index, 'active', `Downloading · ${ev.progress}%`);
      if (li) {
        li.querySelector('.bar > span').style.width = ev.progress + '%';
        if (ev.title) li.querySelector('.title').textContent = ev.title;
      }
    }
    if (ev.type === 'converting') setItem(ev.index, 'active', 'Converting to MP3…');
    if (ev.type === 'done') {
      finished++; updateCount();
      const li = setItem(ev.index, 'done', ev.filename);
      if (li) {
        if (ev.title) li.querySelector('.title').textContent = ev.title;
        li.querySelector('.action').innerHTML = inApp()
          ? `<a class="icon-btn" href="#" data-file="${esc(ev.filename)}" title="Show in Finder">${icon('folder', 18)}</a>`
          : `<a class="icon-btn" href="/file/${encodeURIComponent(ev.filename)}" title="Download">${icon('down', 18)}</a>`;
      }
    }
    if (ev.type === 'error') { finished++; updateCount(); setItem(ev.index, 'error', cleanError(ev.error)); }
    if (ev.type === 'complete') {
      const done = list.querySelectorAll('.item.done').length;
      if (dlAll.style.display !== 'none' && done > 0) {
        dlAll.disabled = false;
        dlAll.querySelector('span').textContent = `Save all (${done}) as .zip`;
      }
      es.close();
    }
  };
  es.onerror = () => es.close();
}

async function startJob(promise, btn) {
  btn.disabled = true;
  try {
    const res = await promise;
    const data = await res.json();
    if (!res.ok) { alert(data.error || 'Request failed'); return; }
    render(data.items, data.job_id);
    listen(data.job_id);
  } catch (e) {
    alert('Error: ' + e.message);
  } finally {
    btn.disabled = false;
  }
}

// YouTube
$('yt-btn').onclick = () => {
  const url = $('yt-url').value.trim();
  if (!url) { $('yt-url').focus(); return; }
  startJob(fetch('/api/youtube', {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({url})
  }), $('yt-btn'));
  $('yt-url').value = '';
};
$('yt-url').addEventListener('keydown', e => { if (e.key === 'Enter') $('yt-btn').click(); });

// Playlist CSV: click or drag-and-drop
let csvFile = null;
function chooseFile(f) {
  if (!f) return;
  csvFile = f;
  $('chosen-name').textContent = f.name;
  $('chosen').hidden = false;
}
$('csv-file').onchange = e => chooseFile(e.target.files[0]);
const drop = $('drop');
['dragenter', 'dragover'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(t => drop.addEventListener(t, () => drop.classList.remove('over')));
drop.addEventListener('drop', e => { e.preventDefault(); chooseFile(e.dataTransfer.files[0]); });
// Don't let a file dropped elsewhere replace the page.
['dragover', 'drop'].forEach(t => window.addEventListener(t, e => e.preventDefault()));

$('csv-btn').onclick = () => {
  if (!csvFile) return;
  const fd = new FormData();
  fd.append('file', csvFile);
  startJob(fetch('/api/playlist', {method: 'POST', body: fd}), $('csv-btn'));
};
</script>
</body>
</html>
