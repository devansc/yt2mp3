# Builds both DMGs and publishes a GitHub Release.
#
# Runs when you push a version tag:   git tag v1.0.1 && git push origin v1.0.1
# or from the Actions tab → "Release" → "Run workflow" (enter a version).
# Normal pushes to main don't trigger it.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create, e.g. v1.0.1"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: arm
            runner: macos-15        # Apple Silicon
          - target: intel
            runner: macos-15-intel  # Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./build_mac.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.target }}
          path: dist/*.dmg

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dmgs
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          gh release create "$TAG" dmgs/*.dmg \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "yt2mp3 $TAG" \
            --generate-notes
